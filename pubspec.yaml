name: bunpod
description: Open-source podcast player app with Flutter and Material 3 Expressive.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.9.0
  cupertino_ui: ^1.1.5
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.0
  motor: ^1.1.0
  gap: ^3.0.1
  image_fade: ^0.6.2
  extended_image: ^10.0.1
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  logarte: ^1.5.0
  expressive_sheet:
    path: packages/expressive_sheet
  expressive_snack:
    path: packages/expressive_snack
  expressive_loading_indicator:
    path: packages/expressive_loading_indicator
  expressive_refresh_indicator:
    path: packages/expressive_refresh_indicator
  expressive_shapes:
    path: packages/expressive_shapes
  material_wavy_progress_indicator:
    path: packages/material_wavy_progress_indicator
  versionarte: ^2.1.2
  stupid_simple_sheet: ^0.9.1+1
  rxdart: ^0.28.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  shared_preferences: ^2.5.6
  userorient_flutter:
    git:
      url: https://github.com/UserOrient/userorient-flutter.git
      ref: redesign
  haptic_feedback: ^0.8.0


dependency_overrides:
  firebase_remote_config: ^7.0.1

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app-icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/vectors/
    - assets/images/

